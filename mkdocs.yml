# ============================================================
# MkDocs Material Wiki 配置
# 拖入 .md 即可，无需手动维护导航（awesome-pages 自动生成）
# ============================================================

site_name: 我的知识库 Wiki
site_description: 基于 Markdown 的分类 / 标签知识库，部署于 GitHub Pages
site_url: https://evener920.github.io/docs/

# 仓库信息（用于右上角编辑/查看源码按钮）
repo_url: https://github.com/evener920/docs
repo_name: docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    # 浅色（默认）
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色
    # 深色
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
  features:
    - navigation.instant      # 瞬时跳转
    - navigation.tracking     # 滚动高亮当前章节
    - navigation.top          # 返回顶部
    - content.code.copy       # 代码块复制按钮
    - search.suggest          # 搜索联想
    - search.highlight        # 搜索结果高亮

# 插件：搜索 + 标签 + 自动导航
plugins:
  - search
  - tags:                     # 标签页：每篇 md 头部写 tags: [...] 即可
      tags_file: tags.md
  - awesome-pages            # 按文件夹结构自动生成侧边导航（拖 md 即生效）

# Markdown 增强
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  generator: false
